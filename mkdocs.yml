site_name: "NeuroArchives: A Field Guide to Neuroscience Data & Resources"
site_description: A field guide to the initiatives that built the world's brain-data infrastructure, and to the open archives, atlases, cohorts, benchmarks and standards they left behind.
site_url: https://neuroarchives.readthedocs.io/
site_author: Laura Medlock
repo_url: https://github.com/lauramedlock/brain-data-docs
repo_name: lauramedlock/brain-data-docs
edit_uri: edit/main/docs/
copyright: Compiled October 2026 &middot; text CC BY 4.0

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: amber
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.snippets
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# Fail the build (with --strict) on links that do not resolve.
validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

extra_css:
  - assets/extra.css

nav:
  - Home: index.md
  - History:
      - Overview: history/index.md
      - Wave 1 - National & Multinational Initiatives: history/national-initiatives.md
      - Wave 2 - Atlases, Connectomes & Mapping Consortia: history/mapping-consortia.md
      - Wave 3 - Data Archives, Standards & Infrastructure: history/infrastructure.md
      - Wave 4 - Foundation Models of the Brain: history/foundation-models.md
      - List of Initiatives: history/master-list.md
      - Outlook Going Forward: history/outlook.md
      - Sources: history/sources.md
  - Resource List:
      - How to Navigate: resources/index.md
      - Multi-Modal Repositories: resources/federated-archives.md
      - Reference Atlases & Coordinate Frameworks: resources/reference-atlases.md
      - Transcriptomics, Epigenomics & Spatial omics: resources/transcriptomics.md
      - Connectomics & Morphology: resources/connectomics.md
      - Neurophysiology (Animal): resources/neurophysiology.md
      - Human Electrophysiology: resources/human-electrophysiology.md
      - Human Neuroimaging: resources/human-neuroimaging.md
      - Behavior, Video & Pose Datasets: resources/behavior.md
      - Computational Models & Simulation: resources/models.md
      - Organoids & Stem Cells: resources/organoids.md
      - Model-Organism Databases: resources/model-organisms.md
      - Disease, Genetics & Biobank Portals: resources/disease-genetics.md
      - Standards, tooling & resource catalogs: resources/standards-catalogs.md
      - Benchmarks & evaluation suites: resources/benchmarks.md
